<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Pokemon Happy Birthday Surprise</title>
    <meta name="description" content="A cute, interactive Pokémon-themed birthday surprise featuring a magical Poké Ball opening, animated handwritten letter with peeking Gardevoir, dramatic Mega Evolution sequence, and grand birthday celebration." />
    <meta property="og:title" content="Pokemon Happy Birthday Surprise" />
    <meta property="og:description" content="A cute, interactive Pokémon-themed birthday surprise featuring a magical Poké Ball opening, animated handwritten letter with peeking Gardevoir, dramatic Mega Evolution sequence, and grand birthday celebration." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body class="bg-[#fef6fb] text-slate-800 antialiased selection:bg-pink-300 selection:text-pink-900 overflow-x-hidden">
    <div id="root">
      <div style="min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:24px 16px;max-width:1024px;margin:0 auto;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;text-align:center;">
        <header style="margin-top:16px;display:flex;flex-direction:column;align-items:center;">
          <div style="display:inline-flex;align-items:center;gap:6px;padding:4px 16px;border-radius:9999px;background:rgba(253,232,242,0.8);border:1px solid #fbcfe8;color:#be185d;font-size:12px;font-weight:700;letter-spacing:0.05em;margin-bottom:8px;">
            <span>✨</span><span>LUDS</span><span>✨</span>
          </div>
          <h1 style="font-size:clamp(2rem, 8vw, 4rem);font-weight:900;letter-spacing:0.03em;margin:4px 0;background:linear-gradient(to right, #ec4899, #f43f5e, #f59e0b);-webkit-background-clip:text;-webkit-text-fill-color:transparent;">
            HAPPY BIRTHDAY
          </h1>
          <p style="color:#475569;font-size:14px;font-weight:500;margin:4px 0 0 0;">
            A magical surprise is waiting inside the Poké Ball...
          </p>
        </header>

        <main style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:24px 0;position:relative;">
          <div style="position:relative;width:clamp(190px, 45vw, 250px);height:clamp(190px, 45vw, 250px);">
            <svg viewBox="0 0 200 200" style="width:100%;height:100%;filter:drop-shadow(0 15px 30px rgba(244,63,94,0.3));">
              <defs>
                <linearGradient id="topG" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ff4b72" />
                  <stop offset="100%" stop-color="#e11d48" />
                </linearGradient>
                <linearGradient id="botG" x1="0%" y1="0%" x2="100%" y2="100%">
                  <stop offset="0%" stop-color="#ffffff" />
                  <stop offset="100%" stop-color="#f1f5f9" />
                </linearGradient>
              </defs>
              <circle cx="100" cy="100" r="92" fill="none" stroke="#1e293b" stroke-width="12" />
              <path d="M 8 100 A 92 92 0 0 1 192 100 Z" fill="url(#topG)" />
              <path d="M 8 100 A 92 92 0 0 0 192 100 Z" fill="url(#botG)" />
              <line x1="8" y1="100" x2="192" y2="100" stroke="#1e293b" stroke-width="12" />
              <circle cx="100" cy="100" r="30" fill="#1e293b" />
              <circle cx="100" cy="100" r="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3" />
              <circle cx="100" cy="100" r="10" fill="#ffffff" />
            </svg>
          </div>

          <div style="margin-top:32px;display:flex;flex-direction:column;align-items:center;">
            <div style="display:inline-flex;align-items:center;gap:10px;padding:14px 36px;border-radius:9999px;background:linear-gradient(to right, #f43f5e, #ec4899, #f59e0b);color:#ffffff;font-weight:700;font-size:18px;box-shadow:0 10px 25px rgba(244,63,94,0.35);">
              <span>CLICK ME</span>
              <span>💖</span>
            </div>
            <span style="font-size:12px;color:#64748b;margin-top:8px;font-weight:500;">
              Loading surprise...
            </span>
          </div>
        </main>

        <footer style="padding:8px 0;">
          <div style="display:inline-flex;align-items:center;gap:8px;padding:6px 16px;border-radius:9999px;background:rgba(255,255,255,0.7);border:1px solid #fce7f3;font-size:12px;font-weight:600;color:#be185d;">
            <span>✨ Tap to begin the adventure! ✨</span>
          </div>
        </footer>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
